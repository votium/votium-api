version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: votium-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: votium
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - votium-network

  # api:
  #   build: .
  #   container_name: votium-api
  #   restart: always
  #   ports:
  #     - "3000:3000"
  #   env_file:
  #     - .env
  #   depends_on:
  #     - postgres
  #   networks:
  #     - votium-network

volumes:
  postgres_data:

networks:
  votium-network:
    driver: bridge